id: io.tether.QVAC.Workbench
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run.sh
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_TRASH=gio
  - --env=GTK_USE_PORTAL=1
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.ScreenSaver
  - --persist=.qvac-workbench
  - --persist=.qvac

modules:
  - name: obsidian
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - ar x obsidian.deb
      - tar xf data.tar.*
      - cp -a opt/Obsidian /app/obsidian
      - rm -f /app/obsidian/chrome-sandbox
      - install -Dm755 obsidian-wrapper /app/bin/obsidian
    sources:
      - type: file
        url: https://github.com/obsidianmd/obsidian-releases/releases/download/v1.12.7/obsidian_1.12.7_amd64.deb
        sha256: 3644e3ef19bcd23db4d17f7c73311b5245429391a2a48b361da93375f59712b0
        dest-filename: obsidian.deb
      - type: script
        dest-filename: obsidian-wrapper
        commands:
          - exec /app/obsidian/obsidian-cli "$@"

  # --- QVAC Workbench (packaged Electron app + desktop integration) ---
  # The archive source is extracted by flatpak-builder before build commands run.
  - name: qvac-workbench
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - |
        if ! grep -q 'type="vcs-browser"' io.tether.QVAC.Workbench.metainfo.xml; then
          sed -i 's|</component>|  <url type="vcs-browser">https://github.com/flathub/io.tether.QVAC.Workbench</url>\n</component>|' io.tether.QVAC.Workbench.metainfo.xml
        fi
      # Theme URLs in the tarball metainfo 404; point compose at PNGs in this repo.
      - |
        sed -i \
          -e 's|https://qvac.tether.io/wp-content/themes/qvac-community-theme/assets/images/hero-workbench-1.png|https://raw.githubusercontent.com/mialso/io.tether.QVAC.Workbench/update-master-4e59a0e/screenshots/hero-workbench-1.png|' \
          -e 's|https://qvac.tether.io/wp-content/themes/qvac-community-theme/assets/images/workbench-2-screen.png|https://raw.githubusercontent.com/mialso/io.tether.QVAC.Workbench/update-master-4e59a0e/screenshots/workbench-2-screen.png|' \
          io.tether.QVAC.Workbench.metainfo.xml
      - install -Dm644 io.tether.QVAC.Workbench.metainfo.xml /app/share/metainfo/io.tether.QVAC.Workbench.metainfo.xml
      - install -Dm644 io.tether.QVAC.Workbench.png /app/share/icons/hicolor/512x512/apps/io.tether.QVAC.Workbench.png
      - install -Dm644 io.tether.QVAC.Workbench.desktop /app/share/applications/io.tether.QVAC.Workbench.desktop
      - install -Dm755 run.sh /app/bin/run.sh
      - cp -a main /app/main
    sources:
      - type: archive
        url: https://static.tether.dev/qv.ac/0.17.1/QV.AC-x64-flatpak.tar.gz
        sha512: e176957d53561145b95c42e5f22fda73ddc2285d659d031009bc086219522f1c1e539de7a4f810283a7a6a3421da098f3ed094ceaf11d4766de5779636ba5c98
        strip-components: 0
        x-checker-data:
          type: html
          url: https://static.tether.dev/qv.ac/
          version-pattern: href="\./((?:\d+\.)+\d+)/"
          url-template: https://static.tether.dev/qv.ac/$version/QV.AC-x64-flatpak.tar.gz
