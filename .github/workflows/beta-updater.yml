name: Beta updater

# Runs the official flatpak-external-data-checker against the beta branch, as Flathub's
# hosted run does for the default branch (it scans only that one). It opens pull requests
# against beta. Beta defaults to "automerge-flathubbot-prs": true unless its own flathub.json
# sets it, and the checker reads that file from beta, not from a PR. So the checker itself
# may merge an updater pull request it finds on a later run, once that pull request's commit
# status is success and it is mergeable; nothing else here merges. See
# .github/beta-updater/README.md, including the Flathub linter exception this needs.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: beta-updater
  cancel-in-progress: false

jobs:
  update:
    # Never run a copy of this workflow from a fork or from any branch other than master.
    if: github.repository == 'flathub/io.tether.QVAC.Workbench' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the trusted master commit (code and production recipe)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      # Data only: nothing in beta is executed. A named local branch, because the checker
      # bases its pull request on the current branch.
      - name: Check out beta
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: beta
          path: beta
          persist-credentials: false

      # Inside the pinned checker image, so the runner needs nothing extra. It changes only the
      # working tree, and only while beta has no staging checker data yet.
      - name: Prepare beta for the official checker (first run only)
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:640890eb1b01defde74e067504f359508cb56a8ec0bae3250d16944c33776582
        with:
          entrypoint: /bin/bash
          args: trusted/.github/beta-updater/prepare-beta.sh trusted beta io.tether.QVAC.Workbench.yml

      - name: Run the official flatpak-external-data-checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:640890eb1b01defde74e067504f359508cb56a8ec0bae3250d16944c33776582
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # This email makes "github-actions[bot]" the commit author.
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork --filter-type archive beta/io.tether.QVAC.Workbench.yml
