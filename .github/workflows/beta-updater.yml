name: Beta updater

# Runs the official flatpak-external-data-checker against the beta branch, as
# Flathub's hosted run does for the default branch (it scans only that one).
# It opens pull requests against beta for human review; nothing here merges.
# See .github/beta-updater/README.md.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: beta-updater
  cancel-in-progress: false

jobs:
  update:
    # Never run a copy of this workflow from a fork or from any branch other than master.
    if: github.repository == 'flathub/io.tether.QVAC.Workbench' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A named local branch: the checker bases its pull request on the current branch.
      - name: Check out beta
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: beta
          persist-credentials: false

      # Fails loudly instead of passing as a no-op, so a beta that is not set up cannot look ready.
      - name: Check that beta is configured for the official checker
        run: |
          ok=true
          grep -qF 'beta-$version/flatpak/QV.AC-x64-flatpak.tar.gz' io.tether.QVAC.Workbench.yml || {
            echo "::error::beta's io.tether.QVAC.Workbench.yml has no staging x-checker-data (a url-template using beta-\$version/flatpak/)"
            ok=false
          }
          jq -e '."automerge-flathubbot-prs" == false' flathub.json > /dev/null 2>&1 || {
            echo "::error::beta's flathub.json does not set \"automerge-flathubbot-prs\": false"
            ok=false
          }
          if [ "$ok" != true ]; then
            echo "Beta is not set up for the official checker, so nothing was checked. Merge the beta manifest pull request first: it carries the staging checker data and automerge false. Runs fail here until then." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run the official flatpak-external-data-checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:640890eb1b01defde74e067504f359508cb56a8ec0bae3250d16944c33776582
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # This email makes "github-actions[bot]" the commit author.
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork --filter-type archive io.tether.QVAC.Workbench.yml
