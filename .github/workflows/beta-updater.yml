name: Beta updater

# Runs the official flatpak-external-data-checker against the beta branch, which
# Flathub's hosted checker does not scan (it only checks the default branch).
# It opens pull requests against beta for human review; nothing here merges.
# See .github/beta-updater/README.md.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: beta-updater
  cancel-in-progress: false

jobs:
  update:
    # Never run a copy of this workflow from a fork or from any branch other than master.
    if: github.repository == 'flathub/io.tether.QVAC.Workbench' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the trusted master commit (scripts and production recipe)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      # Only a 404 means "nothing published yet"; any other failure fails the run.
      - name: Wait for the first published beta archive
        id: archive
        run: bash trusted/.github/beta-updater/prepare-beta.sh ready https://static.tether.dev/qv.ac/beta/flatpak/QV.AC-x64-flatpak.tar.gz >> "$GITHUB_OUTPUT"

      - name: Note that no beta archive is published yet
        if: steps.archive.outputs.ready != 'true'
        run: echo "No beta archive is published yet, so there is nothing to update." >> "$GITHUB_STEP_SUMMARY"

      # A named local branch: the checker bases its pull request on the current branch.
      - name: Check out beta
        if: steps.archive.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: beta
          path: beta
          persist-credentials: false

      - name: Prepare beta for the checker (bootstrap once, never auto-merge)
        if: steps.archive.outputs.ready == 'true'
        run: bash trusted/.github/beta-updater/prepare-beta.sh bootstrap trusted beta io.tether.QVAC.Workbench.yml

      - name: Run the official flatpak-external-data-checker
        if: steps.archive.outputs.ready == 'true'
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:640890eb1b01defde74e067504f359508cb56a8ec0bae3250d16944c33776582
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # This email makes "github-actions[bot]" the commit author.
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork --filter-type archive beta/io.tether.QVAC.Workbench.yml
