name: Beta updater tests

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/beta-updater/**"
      - ".github/workflows/*updater*.yml"
      - "io.tether.QVAC.Workbench.yml"
      - "flathub.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BETA_UPDATER_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run the tests (the official checker image pinned by the updater, local fixtures only)
        run: python3 -I -m unittest discover -s .github/beta-updater/tests -v
